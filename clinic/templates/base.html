{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link type="text/css" href="{% static 'main/css/styles.css' %}" rel="stylesheet"/>
    <title>{% block title %}{% endblock %}</title>
</head>
<body id="body-content">
    <header id="site-header">
        <div id="header-content">
            <nav id="header-nav">
                <div>
                    <label for="page-select">Навигация:</label>
                    <select id="page-select" onchange="handleNavigation(this)">
                        <option value="">Выберите...</option>
                        <option value="{% url 'home' %}">Главная</option>

                        <option value="{% url 'services' %}">Услуги</option>
                        {% if user.is_superuser %}
                            <option value="{% url 'add_service' %}">Добавить услугу</option>
                        {% endif %}

                        <option value="{% url 'categories' %}">Категории услуг</option>
                        {% if user.is_superuser %}
                            <option value="{% url 'add_category' %}">Добавить категорию услуг</option>
                        {% endif %}

                        <option value="{% url 'specializations' %}">Специализации врачей</option>
                        {% if user.is_superuser %}
                            <option value="{% url 'add_specialization' %}">Добавить специализацию врачей</option>
                        {% endif %}

                        <option value="{% url 'doctors' %}">Врачи</option>
                        {% if user.is_superuser %}
                            <option value="{% url 'add_user_for_doctor' %}">Добавить пользователя</option>
                            <option value="{% url 'add_doctor' %}">Добавить врача</option>
                        {% endif %}

                        <option value="{% url 'promocodes' %}">Промокоды</option>
                        {% if user.is_superuser %}
                            <option value="{% url 'add_promocode' %}">Добавить промокод</option>
                        {% endif %}

                        <option value="{% url 'reviews' %}">Отзывы</option>
                        <option value="{% url 'add_review' %}">Оставить отзыв</option>

                        <option value="{% url 'orders' %}">Заказы</option>
                        <option value="{% url 'add_order' %}">Оформить заказ</option>

                        {% if user.is_superuser %}
                            <option value="{% url 'client_logs' %}">Пользовательские логи</option>
                        {% endif %}
                    </select>
                    <label for="users-select">Пользователи:</label>
                    <select id="users-select" onchange="handleNavigation(this)">
                        <option value="">Выберите...</option>
                        {% if user.is_authenticated %}
                            <option value="{% url 'logout' %}">Выйти</option>
                        {% else %}
                            <option value="{% url 'login' %}">Войти</option>
                            <option value="{% url 'register' %}">Регистрация</option>
                        {% endif %}
                    </select>
                </div>
            </nav>
        </div>
    </header>

    <main id="main-content">
        {% block content %} {% endblock %}
    </main>

    <script src="{% static 'main/js/page_selection.js' %}"></script>
</body>
</html>
